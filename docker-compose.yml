version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: project_lien_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_lien
    ports:
      # Host-side 5433, not 5432 (docs/DECISIONS.md D26): 5432 is the single most likely
      # port to already be taken on a dev machine by some *other* project's Postgres, and
      # a stopped-but-still-port-reserved container can make that collision look like a
      # credentials problem instead of a port conflict. The container's own internal port
      # is untouched — api/worker/migrate below still talk to `db:5432` over the Docker
      # network, since that side never goes through the host at all.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates project_lien_test alongside POSTGRES_DB's project_lien on first init —
      # `pnpm test` needs it and nothing had ever created it automatically (D26).
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_lien"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: project_lien_minio
    command: server /data --console-address ":9001"
    environment:
      # Not "minioadmin" (see api/worker's STORAGE_SECRET_KEY comment below for why).
      MINIO_ROOT_USER: project_lien_local
      MINIO_ROOT_PASSWORD: local-compose-minio-password-not-minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: build
    container_name: project_lien_migrate
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/project_lien"
    command: ["node", "packages/db/dist/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: project_lien_api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: "postgres://postgres:postgres@db:5432/project_lien"
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_ACCESS_KEY: "project_lien_local"
      STORAGE_SECRET_KEY: "local-compose-minio-password-not-minioadmin"
      # This stack runs with NODE_ENV=production to exercise the actual production code
      # path (see Dockerfile.api's runner stage) — which since Phase 13 means
      # packages/shared-config/src/env.ts's assertNoInsecureDefaultsInProduction refuses to
      # start if any secret is still at its `.env.example` placeholder value
      # (docs/DECISIONS.md D19). These are still not real secrets — just distinct,
      # compose-local placeholder strings — swap for values from a real secret manager in
      # an actual deployment (docs/DEPLOYMENT.md).
      JWT_ACCESS_SECRET: "local-compose-access-secret-not-the-dev-default"
      JWT_REFRESH_SECRET: "local-compose-refresh-secret-not-the-dev-default"
      WEBHOOK_SIGNING_SECRET: "local-compose-webhook-secret-not-the-dev-default"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: project_lien_worker
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://postgres:postgres@db:5432/project_lien"
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_ACCESS_KEY: "project_lien_local"
      STORAGE_SECRET_KEY: "local-compose-minio-password-not-minioadmin"
      # See the api service's comment above — same fail-fast production-secret check
      # applies here too (apps/worker also calls loadEnv()).
      JWT_ACCESS_SECRET: "local-compose-access-secret-not-the-dev-default"
      JWT_REFRESH_SECRET: "local-compose-refresh-secret-not-the-dev-default"
      WEBHOOK_SIGNING_SECRET: "local-compose-webhook-secret-not-the-dev-default"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: project_lien_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
