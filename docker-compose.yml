version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: project_lien_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_lien
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_lien"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: project_lien_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: build
    container_name: project_lien_migrate
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/project_lien"
    command: ["node", "packages/db/dist/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: project_lien_api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: "postgres://postgres:postgres@db:5432/project_lien"
      STORAGE_ENDPOINT: "http://minio:9000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: project_lien_worker
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://postgres:postgres@db:5432/project_lien"
      STORAGE_ENDPOINT: "http://minio:9000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: project_lien_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
