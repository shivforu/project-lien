name: Dependency audit

# Scheduled pnpm audit (docs/DEPLOYMENT.md's "dependency scanning on a schedule" line item,
# docs/REQUIREMENTS_MATRIX.md #38). Complements Dependabot (.github/dependabot.yml), which
# opens PRs for known-outdated versions on its own schedule — this job instead reports
# newly-disclosed advisories against whatever is currently pinned, since a dependency can
# go from fine to vulnerable without anything in this repo changing.
on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Non-gating (informational): a fresh CVE against a transitive dependency shouldn't
      # silently block every PR the moment it's disclosed. moderate-and-above is still
      # printed in full in the job log for a human to triage, same report this project's
      # own Phase 14 pass read by hand (docs/DECISIONS.md D22).
      - name: pnpm audit (production dependencies, informational)
        run: pnpm audit --prod --audit-level moderate || true
